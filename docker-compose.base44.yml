services:
  web:
    image: node:22-slim
    working_dir: /app
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./:/app
      - wix_node_modules:/app/node_modules
    command: ["sleep", "infinity"]
    # Real dev command is started interactively after deps are installed:
    #   wix login --api-key $WIX_CLI_API_KEY && wix dev

volumes:
  wix_node_modules:
